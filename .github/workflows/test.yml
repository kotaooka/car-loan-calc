# プッシュ時に、解説の埋め込みが最新かと、自動車ローンの検算テストを確認する
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install markdown
      - name: 解説（docs/explanation.md）の埋め込みが最新か
        run: python tools/build.py && git diff --exit-code index.html
      - name: 検算テスト
        run: node tests/test.js
